<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="winnow-runtime-version" content="__WINNOW_RUNTIME_VERSION__" />
    <meta name="winnow-seed-hash" content="__WINNOW_SEED_HASH__" />
    <meta name="winnow-session-id" content="__WINNOW_SESSION_ID__" />
    <meta name="winnow-expires-at" content="0000-00-00T00:00:00.000Z" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Winnow portable session</title>
    <style>
      :root { color-scheme: light; --ink: #192229; --muted: #61707b; --paper: #f7f7f3; --card: #fff; --line: #dbe2e4; --accent: #245c56; --accent-soft: #e3f0ed; --danger: #8d3434; --shadow: 0 18px 60px rgba(23, 48, 50, .08); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.45; }
      button, textarea { font: inherit; }
      button { cursor: pointer; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); padding: .55rem .85rem; }
      button:hover, button:focus-visible { border-color: var(--accent); outline: 3px solid rgba(36, 92, 86, .15); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.subtle { background: transparent; }
      button.danger { color: var(--danger); }
      a { color: var(--accent); }
      .shell { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; padding: 1.4rem 0 4rem; }
      .masthead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
      .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { max-width: 740px; margin-bottom: .4rem; font-size: clamp(1.8rem, 4vw, 3.3rem); line-height: 1.05; letter-spacing: -.04em; }
      h2 { font-size: 1.2rem; margin-bottom: .4rem; }
      h3 { font-size: 1rem; margin-bottom: .25rem; }
      .muted, .meta { color: var(--muted); }
      .meta { font-size: .86rem; }
      .toolbar, .actions, .factor-actions, .card-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
      .toolbar { justify-content: end; }
      .notice, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 1.1rem; box-shadow: var(--shadow); padding: 1rem; }
      .notice { margin: 1rem 0; }
      .notice.warn { border-color: #d7b46a; background: #fff9e9; }
      .notice.error { border-color: #d99a9a; background: #fff1f1; color: var(--danger); }
      .notice.success { border-color: #8fc5b9; background: #effaf6; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
      .card { display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 1.1rem; box-shadow: var(--shadow); }
      .card-body { display: flex; flex: 1; flex-direction: column; gap: .75rem; padding: 1rem; }
      .card-media { width: 100%; aspect-ratio: 16/9; background: #e9eeee; object-fit: cover; }
      .card-media-fallback { display: grid; place-items: center; color: var(--muted); font-size: .85rem; }
      .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem; margin: 0; }
      .facts div { border-top: 1px solid var(--line); padding-top: .35rem; }
      .facts dt { color: var(--muted); font-size: .72rem; }
      .facts dd { margin: 0; font-size: .86rem; }
      .badges { display: flex; flex-wrap: wrap; gap: .35rem; padding: 0; margin: 0; list-style: none; }
      .badge { border-radius: 999px; background: var(--accent-soft); color: var(--accent); padding: .2rem .5rem; font-size: .75rem; }
      .card-actions { margin-top: auto; padding-top: .4rem; }
      .verdict { flex: 1; min-width: 5rem; }
      .verdict.like { color: var(--accent); }
      .verdict.dislike { color: var(--danger); }
      .selected { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
      .factor-row { display: flex; flex-wrap: wrap; gap: .6rem; }
      .factor { display: flex; align-items: center; gap: .45rem; border: 1px solid var(--line); border-radius: .8rem; background: #fff; padding: .45rem .55rem; }
      .factor-label { font-size: .82rem; font-weight: 700; }
      .factor-weight { color: var(--muted); font-size: .73rem; }
      .factor button { padding: .22rem .5rem; font-size: .75rem; }
      .section { margin-top: 1.25rem; }
      .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .75rem; margin-bottom: .65rem; }
      textarea { width: 100%; min-height: 5.5rem; resize: vertical; border: 1px solid var(--line); border-radius: .7rem; background: #fff; padding: .7rem; color: var(--ink); }
      .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
      .source-list { display: grid; gap: .45rem; padding-left: 1.2rem; }
      .source-list li { font-size: .86rem; }
      .source-list small { display: block; color: var(--muted); }
      .learned { display: grid; gap: .5rem; }
      .learned-item { display: flex; align-items: center; justify-content: space-between; gap: .75rem; border: 1px solid var(--line); border-radius: .7rem; padding: .6rem; }
      .status-line { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; color: var(--muted); font-size: .85rem; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .loading { padding: 5rem 1rem; text-align: center; color: var(--muted); }
      .empty { padding: 1.2rem; border: 1px dashed var(--line); border-radius: 1rem; color: var(--muted); }
      @media (max-width: 950px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 650px) { .shell { width: min(100% - 1rem, 1180px); padding-top: .8rem; } .grid, .two-col { grid-template-columns: 1fr; } .toolbar { justify-content: start; } .card-actions button { min-height: 2.7rem; } }
    </style>
  </head>
  <body>
    <main class="shell" id="app" aria-live="polite">
      <div class="loading">Loading this portable session…</div>
    </main>
    <script>
      (() => {
        "use strict";

        const EMBEDDED = "__WINNOW_SEED_BASE64__";
        const EMBEDDED_HASH = "__WINNOW_SEED_HASH__";
        const SESSION_ID = "__WINNOW_SESSION_ID__";
        const RUNTIME_VERSION = "__WINNOW_RUNTIME_VERSION__";
        const EXPIRES_AT = document.querySelector('meta[name="winnow-expires-at"]').content;
        const app = document.getElementById("app");
        const ROUND_SIZE = 4;
        const FACTOR_LIMIT = 6;
        const FRAGMENT_LIMIT = 6000;
        const STORAGE_KEY = "winnow:" + EMBEDDED_HASH;
        const channel = "BroadcastChannel" in window ? new BroadcastChannel("winnow:" + EMBEDDED_HASH) : null;
        let memoryState = null;
        let storageKind = "memory";
        let storageDb = null;
        let seed;
        let state;
        let rounds = [];
        let currentRound;
        let draftFeedback = null;
        let persistenceWarning = "";
        let fragmentWarning = "";
        let staleNotice = "";

        const now = () => new Date().toISOString();
        const id = (prefix) => prefix + "-" + Math.random().toString(36).slice(2, 10) + "-" + Date.now().toString(36);
        const text = (value) => typeof value === "string" ? value : String(value ?? "");
        const escapeHtmlPattern = /<[^>]+>/;
        const validId = (value) => typeof value === "string" && /^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$/.test(value);
        const unique = (values) => new Set(values).size === values.length;
        const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
        const byId = (items) => Object.fromEntries(items.map((item) => [item.id, item]));
        const candidateMap = () => byId(seed.research.candidates);
        const factorMap = () => byId(seed.research.factors);
        const sourceMap = () => byId(seed.research.sources);

        function safeText(value, max = 4000) {
          return typeof value === "string" && value.trim().length > 0 && value.length <= max && !escapeHtmlPattern.test(value);
        }

        function safeHttps(value) {
          try { const url = new URL(value); return url.protocol === "https:" && !url.username && !url.password; } catch (_) { return false; }
        }

        function decodeBase64(value) {
          const bytes = Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
          return JSON.parse(new TextDecoder().decode(bytes));
        }

        function stable(value) {
          if (Array.isArray(value)) return value.map(stable);
          if (value && typeof value === "object") return Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]));
          return value;
        }

        async function sha256(value) {
          const data = new TextEncoder().encode(value);
          const digest = await crypto.subtle.digest("SHA-256", data);
          return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
        }

        function validateSeed(candidateSeed) {
          const errors = [];
          if (!candidateSeed || typeof candidateSeed !== "object") errors.push("seed is not an object");
          if (candidateSeed?.protocol !== "winnow.portable-session") errors.push("unsupported seed protocol");
          if (candidateSeed?.schemaVersion !== 1) errors.push("unsupported seed schema version");
          if (candidateSeed?.runtimeVersion !== RUNTIME_VERSION) errors.push("runtime version mismatch");
          if (candidateSeed?.sessionId !== SESSION_ID) errors.push("session id mismatch");
          if (!safeText(candidateSeed?.query, 1000)) errors.push("invalid query");
          const research = candidateSeed?.research;
          if (!research || !Array.isArray(research.candidates) || !Array.isArray(research.factors) || !Array.isArray(research.sources)) errors.push("invalid research pack");
          if (research && (research.candidates.length < 12 || research.candidates.length > 24)) errors.push("candidate corpus size is outside 12–24");
          if (research && (research.factors.length < 6 || research.factors.length > 10)) errors.push("factor corpus size is outside 6–10");
          if (research) {
            const candidates = candidateMapFor(research.candidates);
            const factors = candidateMapFor(research.factors);
            const sources = candidateMapFor(research.sources);
            if (!unique(Object.keys(candidates)) || !unique(Object.keys(factors)) || !unique(Object.keys(sources))) errors.push("duplicate research ids");
            for (const factor of research.factors) if (!validId(factor.id) || !safeText(factor.label, 120) || !safeText(factor.description)) errors.push("invalid factor");
            let covered = 0;
            for (const candidate of research.candidates) {
              if (!validId(candidate.id) || !safeText(candidate.name, 200) || !Array.isArray(candidate.sourceIds) || !candidate.sourceIds.length) errors.push("invalid candidate");
              for (const sourceId of candidate.sourceIds || []) if (!sources[sourceId]) errors.push("candidate cites missing source");
              for (const factor of research.factors) {
                const value = candidate.facts?.[factor.id];
                if (value !== undefined && value !== "unknown") covered += 1;
                if (value === undefined) errors.push("candidate omits a factor");
                if (value !== undefined && value !== "unknown" && !["boolean", "number", "string"].includes(typeof value) && !(Array.isArray(value) && value.every((item) => typeof item === "string"))) errors.push("invalid candidate fact");
              }
              for (const factorId of Object.keys(candidate.facts || {})) if (!factors[factorId]) errors.push("candidate cites missing factor");
            }
            for (const source of research.sources) if (!validId(source.id) || !safeText(source.title) || !safeHttps(source.url)) errors.push("invalid source");
            if (covered / (research.candidates.length * research.factors.length) < .70) errors.push("research coverage is below 70 percent");
          }
          const presentations = candidateSeed?.presentations;
          if (!Array.isArray(presentations) || presentations.length !== research?.candidates?.length) errors.push("presentations do not cover the corpus");
          if (Array.isArray(presentations) && research) {
            const candidates = candidateMapFor(research.candidates), sources = candidateMapFor(research.sources);
            const seenPresentations = new Set();
            for (const presentation of presentations) {
              const candidate = candidates[presentation?.candidateId];
              if (!candidate || seenPresentations.has(presentation.candidateId)) { errors.push("invalid candidate presentation"); continue; }
              seenPresentations.add(presentation.candidateId);
              if (!Array.isArray(presentation.sourceIds) || !presentation.sourceIds.length || presentation.sourceIds.some((sourceId) => !sources[sourceId] || !candidate.sourceIds.includes(sourceId))) errors.push("presentation cites an invalid source");
              if (!Array.isArray(presentation.blocks) || !presentation.blocks.length || presentation.blocks.length > 16) { errors.push("invalid presentation blocks"); continue; }
              let evidence = false;
              for (const block of presentation.blocks) {
                if (!block || !["title", "text", "metric-grid", "badge-list", "link", "image"].includes(block.type)) { errors.push("unsupported presentation block"); continue; }
                if (block.type === "title") { if (block.text !== candidate.name || !safeText(block.text, 300)) errors.push("presentation title mismatch"); continue; }
                if (block.type === "metric-grid") { for (const item of block.items || []) { if (!safeText(item.label, 120) || !safeText(item.value, 200) || (item.sourceId && (!sources[item.sourceId] || !candidate.sourceIds.includes(item.sourceId))) || (!item.sourceId && item.value.toLowerCase() !== "unknown")) errors.push("invalid metric evidence"); } evidence = true; continue; }
                const source = sources[block.sourceId];
                if (!source || !candidate.sourceIds.includes(block.sourceId)) { errors.push("presentation block cites an invalid source"); continue; }
                if (block.type === "text" && !safeText(block.text)) errors.push("invalid presentation text");
                if (block.type === "badge-list" && (!Array.isArray(block.items) || !block.items.length || block.items.some((item) => !safeText(item, 120)))) errors.push("invalid presentation badges");
                if (block.type === "link" || block.type === "image") { const url = block.url; try { if (!safeHttps(url) || new URL(url).hostname !== new URL(source.url).hostname) errors.push("presentation URL host mismatch"); } catch (_) { errors.push("invalid presentation URL"); } }
                evidence = true;
              }
              if (!evidence) errors.push("presentation has no evidence block");
            }
          }
          if (!candidateSeed?.initialRound || !Array.isArray(candidateSeed.initialRound.candidateIds) || candidateSeed.initialRound.candidateIds.length !== 4 || !unique(candidateSeed.initialRound.candidateIds) || candidateSeed.initialRound.candidateIds.some((candidateId) => !research?.candidates?.some((candidate) => candidate.id === candidateId))) errors.push("invalid initial round candidates");
          if (!candidateSeed?.initialRound || !Array.isArray(candidateSeed.initialRound.factorIds) || candidateSeed.initialRound.factorIds.length > FACTOR_LIMIT || candidateSeed.initialRound.factorIds.some((factorId) => !research?.factors?.some((factor) => factor.id === factorId))) errors.push("invalid initial round factors");
          if (errors.length) throw new Error(errors.join("; "));
          return true;
        }

        function candidateMapFor(items) { return Object.fromEntries((items || []).map((item) => [item.id, item])); }

        function valueComparable(left, right) {
          return left !== "unknown" && right !== "unknown" && left !== undefined && right !== undefined;
        }

        function arraySimilarity(left, right) {
          const a = new Set(left), b = new Set(right);
          if (!a.size && !b.size) return 1;
          let intersection = 0;
          for (const value of a) if (b.has(value)) intersection += 1;
          return intersection / new Set([...a, ...b]).size;
        }

        function factorSimilarity(factor, left, right) {
          if (!valueComparable(left, right)) return null;
          if (factor.valueType === "number" || (typeof left === "number" && typeof right === "number")) {
            const values = seed.research.candidates.map((candidate) => candidate.facts?.[factor.id]).filter((value) => typeof value === "number" && Number.isFinite(value));
            if (!values.length) return null;
            const min = Math.min(...values), max = Math.max(...values);
            if (max === min) return 1;
            return 1 - Math.abs((left - min) / (max - min) - (right - min) / (max - min));
          }
          if (Array.isArray(left) && Array.isArray(right)) return arraySimilarity(left, right);
          return left === right ? 1 : 0;
        }

        function candidateSimilarity(left, right, weights) {
          const factors = seed.research.factors;
          let numerator = 0, denominator = 0;
          for (const factor of factors) {
            const similarity = factorSimilarity(factor, left.facts?.[factor.id], right.facts?.[factor.id]);
            if (similarity === null) continue;
            const weight = weights[factor.id] || 1;
            numerator += weight * similarity;
            denominator += weight;
          }
          return denominator ? numerator / denominator : 0.5;
        }

        function factorCoverage(candidate, factors) {
          const comparable = factors.filter((factor) => valueComparable(candidate.facts?.[factor.id], "x"));
          return factors.length ? comparable.length / factors.length : 0;
        }

        function historyByCandidate() {
          const latest = new Map();
          for (const event of state.events) if (event.type === "feedback") for (const verdict of event.verdicts) latest.set(verdict.candidateId, { ...verdict, roundIndex: event.roundIndex });
          return latest;
        }

        function likedAndDisliked() {
          const latest = historyByCandidate();
          const candidates = candidateMap();
          return {
            likes: [...latest].filter(([, verdict]) => verdict.decision === "like").map(([candidateId]) => candidates[candidateId]).filter(Boolean),
            dislikes: [...latest].filter(([, verdict]) => verdict.decision === "dislike").map(([candidateId]) => candidates[candidateId]).filter(Boolean),
          };
        }

        function preference(candidate, weights) {
          const { likes, dislikes } = likedAndDisliked();
          const terms = [];
          for (const liked of likes) terms.push(candidateSimilarity(candidate, liked, weights));
          for (const disliked of dislikes) terms.push(1 - candidateSimilarity(candidate, disliked, weights));
          return terms.length ? terms.reduce((sum, value) => sum + value, 0) / terms.length : 0.5;
        }

        function variedFactorIds(candidates) {
          const variation = seed.research.factors.map((factor) => {
            const values = candidates.map((candidate) => candidate.facts?.[factor.id]).filter((value) => value !== undefined && value !== "unknown");
            return { id: factor.id, score: new Set(values.map((value) => JSON.stringify(value))).size };
          });
          return variation.sort((left, right) => right.score - left.score || left.id.localeCompare(right.id)).map((item) => item.id);
        }

        function currentWeights() {
          const weights = Object.fromEntries(seed.research.factors.map((factor) => [factor.id, 1]));
          for (const event of state.events) {
            if (event.type === "factor") weights[event.factorId] = clamp(weights[event.factorId] * (event.direction === "more" ? 1.5 : event.direction === "less" ? 1 / 1.5 : 1), .25, 4);
            if (event.type === "pattern-reject") weights[event.factorId] = 1;
          }
          return weights;
        }

        function factorIdsFor(candidates, previous) {
          const weights = currentWeights();
          const emphasized = Object.keys(weights).filter((factorId) => Math.abs(weights[factorId] - 1) > .001).sort((left, right) => Math.abs(weights[right] - 1) - Math.abs(weights[left] - 1) || left.localeCompare(right));
          const selected = [];
          for (const factorId of [...emphasized, ...variedFactorIds(candidates)]) if (!selected.includes(factorId) && selected.length < FACTOR_LIMIT) selected.push(factorId);
          if (!selected.length) selected.push(...seed.initialRound.factorIds.slice(0, FACTOR_LIMIT));
          return { ids: selected, weights, added: previous ? selected.filter((factorId) => !previous.factorIds.includes(factorId)) : [], removed: previous ? previous.factorIds.filter((factorId) => !selected.includes(factorId)) : [] };
        }

        function chooseDeck() {
          const candidates = seed.research.candidates;
          const seen = new Set([...state.events.flatMap((event) => event.type === "round" ? event.candidateIds : []), ...state.events.filter((event) => event.type === "feedback").flatMap((event) => event.candidateIds)]);
          const unseen = candidates.filter((candidate) => !seen.has(candidate.id));
          const { likes } = likedAndDisliked();
          const weights = currentWeights();
          const selected = [];
          const scored = [];
          while (selected.length < ROUND_SIZE && selected.length < unseen.length) {
            const remaining = unseen.filter((candidate) => !selected.includes(candidate));
            const ranked = remaining.map((candidate) => {
              const diversity = selected.length ? 1 - Math.max(...selected.map((chosen) => candidateSimilarity(candidate, chosen, weights))) : 1;
              return { candidate, score: .75 * preference(candidate, weights) + .15 * diversity + .10 * factorCoverage(candidate, seed.research.factors) };
            }).sort((left, right) => right.score - left.score || left.candidate.id.localeCompare(right.candidate.id));
            const next = ranked[0];
            if (!next) break;
            selected.push(next.candidate);
            scored.push({ candidateId: next.candidate.id, score: next.score });
          }
          let finalComparison = false;
          let freshResearchRecommended = false;
          if (selected.length === 1 && likes.length) {
            const anchor = strongestLiked(likes, weights, selected[0])[0];
            if (anchor) selected.push(anchor);
          } else if (!selected.length && likes.length >= 2) {
            selected.push(...strongestLiked(likes, weights).slice(0, 2));
            finalComparison = true;
          } else if (!selected.length) {
            freshResearchRecommended = true;
          }
          return { candidates: selected, scored, finalComparison, freshResearchRecommended };
        }

        function strongestLiked(likes, weights, exclude) {
          return [...likes].filter((candidate) => !exclude || candidate.id !== exclude.id).sort((left, right) => {
            const leftScore = likes.filter((other) => other.id !== left.id).reduce((sum, other) => sum + candidateSimilarity(left, other, weights), 0);
            const rightScore = likes.filter((other) => other.id !== right.id).reduce((sum, other) => sum + candidateSimilarity(right, other, weights), 0);
            return rightScore - leftScore || left.id.localeCompare(right.id);
          });
        }

        function initialRound() {
          return { index: 0, candidateIds: seed.initialRound.candidateIds, factorIds: seed.initialRound.factorIds, added: [], removed: [], explanation: seed.initialRound.generationExplanation, finalComparison: false, freshResearchRecommended: false };
        }

        function recomputeRounds() {
          const result = [initialRound()];
          for (const event of state.events.filter((item) => item.type === "feedback")) {
            const previous = result[result.length - 1];
            const deck = chooseDeckForState(result, event);
            const factors = factorIdsFor(deck.candidates, previous);
            result.push({ index: result.length, candidateIds: deck.candidates.map((candidate) => candidate.id), factorIds: factors.ids, added: factors.added, removed: factors.removed, explanation: explanationFor(deck, factors), finalComparison: deck.finalComparison, freshResearchRecommended: deck.freshResearchRecommended });
          }
          return result;
        }

        function chooseDeckForState(previousRounds, nextEvent) {
          const saved = state;
          const priorEvents = state.events;
          state = { ...state, events: [...priorEvents.slice(0, priorEvents.indexOf(nextEvent) + 1)] };
          const deck = chooseDeck();
          state = saved;
          return deck;
        }

        function explanationFor(deck, factors) {
          if (deck.finalComparison) return "The researched corpus is exhausted, so this is a final comparison of your strongest liked options.";
          if (deck.freshResearchRecommended) return "The researched corpus is exhausted before two likes were available. Fresh research is recommended.";
          const { likes, dislikes } = likedAndDisliked();
          if (!likes.length && !dislikes.length) return "This round balances researched evidence and diversity while learning from your structured ratings.";
          if (likes.length && dislikes.length) return "This round favors options similar to likes and dissimilar to dislikes, with researched evidence and diversity as tie-breakers.";
          if (likes.length) return "This round favors options similar to your likes while preserving diversity and researched evidence.";
          return "This round favors options dissimilar to your dislikes while preserving diversity and researched evidence.";
        }

        function cardFor(candidateId) {
          const presentation = seed.presentations.find((item) => item.candidateId === candidateId);
          return presentation ? { ...presentation, candidate: candidateMap()[candidateId] } : null;
        }

        function currentRoundData() {
          rounds = recomputeRounds();
          currentRound = rounds[rounds.length - 1];
          return currentRound;
        }

        function getCurrentVerdict(candidateId) {
          return historyByCandidate().get(candidateId)?.decision;
        }

        function learnedPatterns() {
          const counts = Object.fromEntries(seed.research.factors.map((factor) => [factor.id, { positive: 0, negative: 0 }]));
          for (const event of state.events) if (event.type === "feedback") for (const verdict of event.verdicts) for (const [factorId, reaction] of Object.entries(verdict.factorReactions || {})) if (counts[factorId]) counts[factorId][reaction === "positive" ? "positive" : reaction === "negative" ? "negative" : "positive"] += 1;
          return seed.research.factors.flatMap((factor) => {
            const count = counts[factor.id];
            const weight = currentWeights()[factor.id];
            if (!count || (!count.positive && !count.negative && weight === 1)) return [];
            const direction = count.positive || count.negative ? (count.positive >= count.negative ? "more" : "less") : (weight > 1 ? "more" : "less");
            return [{ factor, count, direction, statement: `${direction === "more" ? "More" : "Less"} ${factor.label.toLowerCase()} appears useful based on your structured ratings.` }];
          });
        }

        function unresolvedNotes() { return state.events.filter((event) => event.type === "feedback" || event.type === "consideration").map((event) => event.note || event.text).filter(Boolean); }

        function reasonsForContinuation() {
          const reasons = ["user_requested"];
          if (unresolvedNotes().length) reasons.push("free_text_unapplied");
          const { likes, dislikes } = likedAndDisliked();
          if (dislikes.length && !likes.length) reasons.push("all_disliked");
          if (currentRound?.freshResearchRecommended) reasons.push("corpus_exhausted");
          const emphasized = Object.entries(currentWeights()).filter(([, weight]) => weight !== 1).map(([factorId]) => factorId);
          if (emphasized.some((factorId) => currentRound.candidateIds.every((candidateId) => candidateMap()[candidateId].facts?.[factorId] === undefined || candidateMap()[candidateId].facts?.[factorId] === "unknown"))) reasons.push("missing_evidence");
          const asOf = Date.parse(seed.research.asOf);
          if (Number.isFinite(asOf) && Date.now() - asOf > 7 * 86400000) reasons.push("research_stale");
          return [...new Set(reasons)];
        }

        function makeContinuation() {
          const latest = historyByCandidate();
          return {
            protocol: "winnow.continuation",
            schemaVersion: 1,
            parent: { sessionId: seed.sessionId, seedHash: EMBEDDED_HASH, url: location.href.split("#")[0], researchAsOf: seed.research.asOf },
            query: seed.query,
            activePatterns: learnedPatterns().map((pattern) => pattern.statement),
            factorWeights: currentWeights(),
            verdictHistory: [...latest].map(([candidateId, verdict]) => ({ candidateId, candidateName: candidateMap()[candidateId]?.name || "Unknown candidate", decision: verdict.decision, roundIndex: verdict.roundIndex })),
            seenCandidateIds: [...new Set(state.events.flatMap((event) => event.candidateIds || []))],
            unresolvedNotes: unresolvedNotes(),
            reasons: reasonsForContinuation(),
          };
        }

        async function openStorage() {
          try {
            if (!window.indexedDB) throw new Error("IndexedDB unavailable");
            storageDb = await new Promise((resolve, reject) => {
              const request = indexedDB.open("winnow-portable", 1);
              request.onupgradeneeded = () => request.result.createObjectStore("sessions");
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            storageKind = "indexeddb";
          } catch (_) {
            try {
              const raw = localStorage.getItem(STORAGE_KEY);
              memoryState = raw ? JSON.parse(raw) : null;
              storageKind = "localstorage";
            } catch (_) { storageKind = "memory"; persistenceWarning = "Browser storage is unavailable; progress will last only while this tab remains open."; }
          }
        }

        async function loadStoredState() {
          if (storageKind === "indexeddb" && storageDb) {
            try { return await new Promise((resolve, reject) => { const tx = storageDb.transaction("sessions", "readonly"); const request = tx.objectStore("sessions").get(EMBEDDED_HASH); request.onsuccess = () => resolve(request.result?.state || null); request.onerror = () => reject(request.error); }); } catch (_) { persistenceWarning = "IndexedDB could not be read; using a best-effort fallback."; }
          }
          return memoryState || null;
        }

        async function saveStoredState(next, expectedRevision) {
          if (state.revision !== expectedRevision) { staleNotice = "This tab had stale progress; reload was not overwritten."; render(); return false; }
          const held = await loadStoredState();
          if (held && Number.isInteger(held.revision) && held.revision > expectedRevision) { staleNotice = "Another tab has newer progress; reload was not overwritten."; render(); return false; }
          if (storageKind === "indexeddb" && storageDb) {
            try { await new Promise((resolve, reject) => { const tx = storageDb.transaction("sessions", "readwrite"); tx.objectStore("sessions").put({ state: next, updatedAt: now() }, EMBEDDED_HASH); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); }); }
            catch (_) { persistenceWarning = "IndexedDB save failed; using a best-effort fallback."; storageKind = "localstorage"; }
          }
          if (storageKind === "localstorage") {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ state: next, updatedAt: now() })); } catch (_) { persistenceWarning = "Browser storage quota was denied; progress may not survive reload."; storageKind = "memory"; }
          }
          if (storageKind === "memory") memoryState = { state: next, updatedAt: now() };

          channel?.postMessage({ revision: state.revision });

        }

        async function requestPersistence() {
          try { if (navigator.storage?.persist) { const granted = await navigator.storage.persist(); if (!granted) persistenceWarning = "The browser did not grant durable storage; keep an export if this session matters."; } } catch (_) { persistenceWarning = "Durable storage could not be requested; keep an export if this session matters."; }
        }

        function encodeUrlBytes(value) { return btoa(String.fromCharCode(...new TextEncoder().encode(value))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }

        async function syncFragment() {
          const payload = { seedHash: EMBEDDED_HASH, revision: state.revision, events: state.events };
          const encoded = encodeUrlBytes(JSON.stringify(payload));
          if (encoded.length > FRAGMENT_LIMIT) { fragmentWarning = "This session is too large for a portable URL fragment; use the full .winnow.json export."; history.replaceState(null, "", location.pathname + location.search); return; }
          const digest = await sha256(JSON.stringify(stable(payload)));
          history.replaceState(null, "", location.pathname + location.search + "#w1=" + encoded + "." + digest.slice(0, 12));
        }

        async function importFragment() {
          const match = location.hash.match(/^#w1=([^\.]+)\.([0-9a-f]{12})$/);
          if (!match) return null;
          try {
            const payloadText = decodeUrlBytes(match[1]);
            const expected = await sha256(JSON.stringify(stable(JSON.parse(payloadText))));
            if (expected.slice(0, 12) !== match[2]) throw new Error("fragment checksum mismatch");
            const payload = JSON.parse(payloadText);
            if (payload.seedHash !== EMBEDDED_HASH || !Array.isArray(payload.events) || !Number.isInteger(payload.revision)) throw new Error("fragment lineage mismatch");
            validateEvents(payload.events);
            return payload;
          } catch (_) { fragmentWarning = "The URL fragment was rejected as corrupted or unrelated to this session."; return null; }
        }

        function validateEvents(events) {
          if (!Array.isArray(events) || events.length > 1000) throw new Error("invalid event log");
          const candidates = candidateMap();
          for (const event of events) {
            if (!event || !validId(event.id) || !["feedback", "factor", "pattern-reject", "consideration", "decision"].includes(event.type)) throw new Error("invalid event");
            if (event.type === "feedback") {
              if (!Array.isArray(event.candidateIds) || !Array.isArray(event.verdicts) || event.verdicts.length !== event.candidateIds.length) throw new Error("invalid feedback event");
              for (const candidateId of event.candidateIds) if (!candidates[candidateId]) throw new Error("feedback candidate is not in seed");
              for (const verdict of event.verdicts) if (!candidates[verdict.candidateId] || !["like", "dislike", "skip"].includes(verdict.decision)) throw new Error("invalid verdict");
            }
            if (event.type === "factor" || event.type === "pattern-reject") if (!factorMap()[event.factorId]) throw new Error("invalid factor event");
            if (event.type === "consideration" && !safeText(event.text, 1000)) throw new Error("invalid consideration");
            if (event.type === "decision" && !candidates[event.candidateId]) throw new Error("invalid decision");
          }
          return true;
        }

        function validateStoredState(value) {
          if (!value || value.protocol !== "winnow.local-state" || value.schemaVersion !== 1 || value.seedHash !== EMBEDDED_HASH || !Number.isInteger(value.revision) || value.revision < 0 || !["ready", "decided"].includes(value.status)) throw new Error("corrupted local state");

          if (value.decision && (!candidateMap()[value.decision.candidateId] || !Number.isInteger(value.decision.roundIndex) || value.decision.roundIndex < 0)) throw new Error("corrupted decision state");
          return true;
        }

        function defaultState() { return { protocol: "winnow.local-state", schemaVersion: 1, seedHash: EMBEDDED_HASH, revision: 0, status: "ready", events: [] }; }

        function historyLabel() { return state.events.filter((event) => event.type === "feedback").length + 1; }

        async function dispatch(event) {
          const expectedRevision = state.revision;
          const next = { ...state, revision: expectedRevision + 1, events: [...state.events, { ...event, id: event.id || id(event.type), createdAt: event.createdAt || now() }] };
          if (event.type === "decision") { next.status = "decided"; next.decision = { candidateId: event.candidateId, roundIndex: currentRound.index, committedAt: next.events[next.events.length - 1].createdAt }; }
          const saved = await saveStoredState(next, expectedRevision);
          if (saved) { currentRoundData(); render(); if (event.type === "feedback") requestPersistence(); }
        }

        function renderBlock(block, candidate) {
          const sourceBy = sourceMap();
          const wrap = document.createElement("div");
          if (block.type === "title") { const title = document.createElement("h3"); title.textContent = candidate.name; wrap.append(title); return wrap; }
          if (block.type === "image") {
            try { const imageUrl = new URL(block.url), citedUrl = new URL(sourceBy[block.sourceId].url); if (imageUrl.hostname !== citedUrl.hostname) throw new Error("host mismatch"); const image = document.createElement("img"); image.className = "card-media"; image.loading = "lazy"; image.referrerPolicy = "no-referrer"; image.src = imageUrl.href; image.alt = block.alt; image.addEventListener("error", () => { image.replaceWith(fallbackMedia("Image unavailable")); }); wrap.append(image); } catch (_) { wrap.append(fallbackMedia("Image unavailable")); }

          }

          if (block.type === "metric-grid") { const list = document.createElement("dl"); list.className = "facts"; for (const item of block.items || []) { const term = document.createElement("dt"), value = document.createElement("dd"); term.textContent = item.label; value.textContent = [item.value, item.unit].filter(Boolean).join(" "); const cell = document.createElement("div"); cell.append(term, value); list.append(cell); } wrap.append(list); return wrap; }
          if (block.type === "badge-list") { const list = document.createElement("ul"); list.className = "badges"; for (const item of block.items || []) { const entry = document.createElement("li"); entry.className = "badge"; entry.textContent = item; list.append(entry); } wrap.append(list); return wrap; }

          return wrap;
        }

        function fallbackMedia(label) { const fallback = document.createElement("div"); fallback.className = "card-media card-media-fallback"; fallback.textContent = label; return fallback; }

        function renderCard(candidateId) {
          const item = cardFor(candidateId); const candidate = item?.candidate; const article = document.createElement("article"); article.className = "card"; article.dataset.candidateId = candidateId;
          if (getCurrentVerdict(candidateId) === "like") article.classList.add("selected");
          const body = document.createElement("div"); body.className = "card-body";
          for (const block of item?.blocks || []) body.append(renderBlock(block, candidate));
          const verdict = getCurrentVerdict(candidateId);
          const actions = document.createElement("div"); actions.className = "card-actions";
          for (const decision of ["like", "dislike", "skip"]) { const button = document.createElement("button"); button.className = "verdict " + decision; button.type = "button"; button.textContent = decision === "like" ? "Like" : decision === "dislike" ? "Dislike" : "Skip"; button.setAttribute("aria-pressed", String(verdict === decision)); button.addEventListener("click", () => setVerdict(candidateId, decision)); actions.append(button); }
          const choose = document.createElement("button"); choose.type = "button"; choose.className = "subtle"; choose.textContent = "Choose"; choose.addEventListener("click", () => commitCandidate(candidateId)); actions.append(choose);
          body.append(actions); article.append(body); return article;
        }

        async function setVerdict(candidateId, decision) {
          if (state.status === "decided") return;
          const shown = currentRound.candidateIds; const verdicts = Object.fromEntries((draftFeedback?.roundIndex === currentRound.index ? draftFeedback.verdicts : []).map((verdict) => [verdict.candidateId, verdict]));
          verdicts[candidateId] = { candidateId, decision, factorReactions: {} };
          const all = shown.every((idValue) => verdicts[idValue]);
          draftFeedback = { roundIndex: currentRound.index, candidateIds: shown, verdicts: Object.values(verdicts) };
          if (all) {
            const completed = draftFeedback;
            draftFeedback = null;
            await dispatch({ type: "feedback", roundIndex: currentRound.index, candidateIds: shown, verdicts: completed.verdicts, note: document.getElementById("round-note")?.value.trim() || "" });
          } else render();
        }

        async function commitCandidate(candidateId) { if (state.status === "decided") return; await dispatch({ type: "decision", candidateId, roundIndex: currentRound.index }); }

        function addFactorEvent(factorId, direction) { return dispatch({ type: "factor", factorId, direction }); }
        function rejectPattern(factorId) { return dispatch({ type: "pattern-reject", factorId }); }

        function createButton(label, handler, className = "") { const button = document.createElement("button"); button.type = "button"; button.className = className; button.textContent = label; button.addEventListener("click", handler); return button; }

        async function copyText(value) {
          try { await navigator.clipboard.writeText(value); return true; } catch (_) { const input = document.createElement("textarea"); input.value = value; input.setAttribute("readonly", ""); input.style.position = "fixed"; input.style.opacity = "0"; document.body.append(input); input.select(); const copied = document.execCommand("copy"); input.remove(); return copied; }
        }

        async function copyContinuation() { const copied = await copyText(JSON.stringify(makeContinuation(), null, 2)); alert(copied ? "Continuation copied. Give it to the research assistant to create a new Site." : "Copy failed; use the download export instead."); }
        async function copySessionLink() { const copied = await copyText(location.href); alert(copied ? "Session link copied." : "Copy failed; use the full export instead."); }
        async function shareSession() { const packageText = JSON.stringify(makeContinuation(), null, 2); try { if (navigator.share) await navigator.share({ title: "Winnow continuation", text: packageText }); else await copyText(packageText); } catch (_) {} }

        function importFullExport() {
          const input = document.createElement("input"); input.type = "file"; input.accept = ".json,application/json"; input.addEventListener("change", () => {
            const file = input.files?.[0]; if (!file) return;
            const reader = new FileReader(); reader.addEventListener("load", async () => {
              try {
                const imported = JSON.parse(text(reader.result));
                if (imported.protocol !== "winnow.export" || imported.schemaVersion !== 1 || imported.seedHash !== EMBEDDED_HASH) throw new Error("export lineage does not match this session");
                validateStoredState(imported.state);
                const expectedRevision = state.revision;
                const next = { ...imported.state, revision: Math.max(expectedRevision, imported.state.revision) + 1 };
                if (window.confirm("Replace this tab's progress with the imported export?")) { await saveStoredState(next, expectedRevision); currentRoundData(); render(); }
              } catch (error) { alert("Import rejected: " + text(error.message || "invalid export")); }
            }); reader.readAsText(file);
          }); input.click();
        }

        function download(name, value, type) { const blob = new Blob([value], { type }); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = name; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
        function downloadContinuation() { download("winnow-continuation.json", JSON.stringify(makeContinuation(), null, 2), "application/json"); }
        function downloadFullExport() { download("winnow.winnow.json", JSON.stringify({ protocol: "winnow.export", schemaVersion: 1, seedHash: EMBEDDED_HASH, seed, state }, null, 2), "application/json"); }

        function sourcePanel() {
          const panel = document.createElement("section"); panel.className = "panel section"; panel.setAttribute("aria-labelledby", "research-title"); const heading = document.createElement("h2"); heading.id = "research-title"; heading.textContent = "Research disclosure"; panel.append(heading); const summary = document.createElement("p"); summary.textContent = seed.research.summary; panel.append(summary); const assumption = document.createElement("p"); assumption.className = "meta"; assumption.textContent = "Assumptions: " + (seed.research.assumptions.join(" · ") || "None recorded"); panel.append(assumption); const list = document.createElement("ol"); list.className = "source-list"; for (const source of seed.research.sources) { const entry = document.createElement("li"); const link = document.createElement("a"); link.href = safeHttps(source.url) ? source.url : "#"; link.target = "_blank"; link.rel = "noopener noreferrer"; link.referrerPolicy = "no-referrer"; link.textContent = source.title; const small = document.createElement("small"); small.textContent = "Retrieved " + source.retrievedAt; entry.append(link, small); list.append(entry); } panel.append(list); return panel;
        }

        function factorPanel() {
          const panel = document.createElement("section"); panel.className = "panel section"; const head = document.createElement("div"); head.className = "section-head"; const title = document.createElement("h2"); title.textContent = "What matters in this round"; const meta = document.createElement("span"); meta.className = "meta"; meta.textContent = `Factors ${currentRound.added.length ? "added: " + currentRound.added.join(", ") : ""}${currentRound.removed.length ? " · removed: " + currentRound.removed.join(", ") : ""}`; head.append(title, meta); panel.append(head); const row = document.createElement("div"); row.className = "factor-row"; const weights = currentWeights(); for (const factorId of currentRound.factorIds) { const factor = factorMap()[factorId]; if (!factor) continue; const item = document.createElement("div"); item.className = "factor"; const label = document.createElement("span"); label.className = "factor-label"; label.textContent = factor.label; const weight = document.createElement("span"); weight.className = "factor-weight"; weight.textContent = `×${weights[factorId].toFixed(2)}`; item.append(label, weight, createButton("More", () => addFactorEvent(factorId, "more")), createButton("Less", () => addFactorEvent(factorId, "less"))); row.append(item); } panel.append(row); return panel;
        }

        function learnedPanel() {
          const patterns = learnedPatterns(); if (!patterns.length) return null; const panel = document.createElement("section"); panel.className = "panel section"; const title = document.createElement("h2"); title.textContent = "Learned patterns"; panel.append(title); const list = document.createElement("div"); list.className = "learned"; for (const pattern of patterns) { const item = document.createElement("div"); item.className = "learned-item"; const label = document.createElement("span"); label.textContent = pattern.statement; item.append(label, createButton("Reject pattern", () => rejectPattern(pattern.factor.id), "danger")); list.append(item); } panel.append(list); return panel;
        }

        function actionsPanel() {
          const panel = document.createElement("section"); panel.className = "panel section"; const head = document.createElement("div"); head.className = "section-head"; const title = document.createElement("h2"); title.textContent = "Take your progress with you"; head.append(title); const actions = document.createElement("div"); actions.className = "actions"; actions.append(createButton("Copy session link", copySessionLink), createButton("Download .winnow.json", downloadFullExport), createButton("Import .winnow.json", importFullExport), createButton("Copy for assistant", copyContinuation, "primary"), createButton("Download continuation", downloadContinuation), createButton("Share", shareSession)); head.append(actions); panel.append(head); const explain = document.createElement("p"); explain.className = "meta"; explain.textContent = "Structured ratings and factor emphasis drive local ranking. Free text is saved as unresolved and is not interpreted by hidden keyword rules."; panel.append(explain); return panel;
        }

        function decisionPanel() {
          if (state.status !== "decided" || !state.decision) return null; const candidate = candidateMap()[state.decision.candidateId]; const panel = document.createElement("section"); panel.className = "notice success section"; const title = document.createElement("h2"); title.textContent = "Decision recorded"; const summary = document.createElement("p"); summary.textContent = `${candidate?.name || "Candidate"} was chosen after ${state.decision.roundIndex + 1} round${state.decision.roundIndex === 0 ? "" : "s"}. Evidence and verdict history remain available in the export.`; panel.append(title, summary); return panel;
        }

        function render() {
          if (!currentRound) return; app.replaceChildren(); const header = document.createElement("header"); header.className = "masthead"; const heading = document.createElement("div"); const eyebrow = document.createElement("div"); eyebrow.className = "eyebrow"; eyebrow.textContent = "Portable Winnow"; const title = document.createElement("h1"); title.textContent = seed.query; const meta = document.createElement("div"); meta.className = "status-line"; meta.textContent = `Round ${currentRound.index + 1} · ${state.status === "decided" ? "decision recorded" : currentRound.finalComparison ? "final comparison" : "local adaptive selection"}`; heading.append(eyebrow, title, meta); const toolbar = document.createElement("div"); toolbar.className = "toolbar"; toolbar.append(createButton("Copy for assistant", copyContinuation, "primary"), createButton("Full export", downloadFullExport)); header.append(heading, toolbar); app.append(header);
          const expiration = document.createElement("div"); expiration.className = "notice warn"; expiration.textContent = EXPIRES_AT.startsWith("0000") ? "Local preview: publishing will set the anonymous Site expiration." : `Anonymous Site expires ${new Date(EXPIRES_AT).toLocaleString()}. Anyone with this URL can read the embedded research.`; app.append(expiration);
          if (persistenceWarning) { const notice = document.createElement("div"); notice.className = "notice warn"; notice.textContent = persistenceWarning; app.append(notice); }
          if (fragmentWarning || staleNotice) { const notice = document.createElement("div"); notice.className = "notice warn"; notice.textContent = fragmentWarning || staleNotice; app.append(notice); }
          const explanation = document.createElement("div"); explanation.className = "notice"; explanation.textContent = currentRound.explanation; app.append(explanation);
          app.append(factorPanel()); const deck = document.createElement("section"); deck.className = "section"; const deckHead = document.createElement("div"); deckHead.className = "section-head"; const deckTitle = document.createElement("h2"); deckTitle.textContent = currentRound.freshResearchRecommended ? "Fresh research recommended" : currentRound.finalComparison ? "Your strongest liked options" : "Compare these options"; const deckMeta = document.createElement("span"); deckMeta.className = "meta"; deckMeta.textContent = state.status === "decided" ? "Decision is final for this session" : "Rate every card to continue"; deckHead.append(deckTitle, deckMeta); deck.append(deckHead); const grid = document.createElement("div"); grid.className = "grid"; for (const candidateId of currentRound.candidateIds) grid.append(renderCard(candidateId)); if (!currentRound.candidateIds.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "This corpus cannot support another local round. Copy the continuation for fresh research."; deck.append(empty); } else deck.append(grid); app.append(deck);
          const notePanel = document.createElement("section"); notePanel.className = "panel section"; const noteLabel = document.createElement("label"); noteLabel.htmlFor = "round-note"; noteLabel.textContent = "Round note or added consideration (optional)"; const note = document.createElement("textarea"); note.id = "round-note"; note.placeholder = "Saved for the assistant; not applied to local ranking."; const previousNote = [...state.events].reverse().find((event) => event.type === "feedback" && event.roundIndex === currentRound.index)?.note; note.value = previousNote || ""; notePanel.append(noteLabel, note); app.append(notePanel);
          const patterns = learnedPanel(); if (patterns) app.append(patterns); const decision = decisionPanel(); if (decision) app.append(decision); app.append(actionsPanel()); app.append(sourcePanel());
        }

        async function boot() {
          try {
            seed = decodeBase64(EMBEDDED); validateSeed(seed);
            const calculatedHash = await sha256(JSON.stringify(stable(seed))); if (calculatedHash !== EMBEDDED_HASH) throw new Error("embedded seed hash mismatch");
            await openStorage(); const stored = await loadStoredState(); const fragment = await importFragment();
            if (stored?.state && stored.state.seedHash === EMBEDDED_HASH) { validateStoredState(stored.state); state = stored.state; } else state = defaultState();
            if (fragment && fragment.revision > state.revision) state = { ...state, revision: fragment.revision, events: fragment.events };
            else if (fragment && fragment.revision === state.revision && JSON.stringify(fragment.events) !== JSON.stringify(state.events) && window.confirm("This URL contains a different history at the same revision. Import it?")) state = { ...state, events: fragment.events };
            validateStoredState(state); currentRoundData(); render();
            if (fragment && fragment.revision > (stored?.state?.revision || -1)) await saveStoredState(state, state.revision);
          } catch (error) { app.replaceChildren(); const notice = document.createElement("div"); notice.className = "notice error"; notice.textContent = "This portable session could not be safely loaded: " + text(error.message || "invalid data"); app.append(notice); }
        }

        channel?.addEventListener("message", async () => { const latest = await loadStoredState(); if (latest?.revision > state?.revision) { state = latest; currentRoundData(); render(); } });
        window.WinnowPortable = { validateSeed, candidateSimilarity, currentWeights, makeContinuation, selectNextRound: chooseDeck, validateEvents };
        boot();
      })();
