name: Winnow Remote CI

on:
  pull_request:
    paths:
      - "remote/**"
      - ".agents/skills/winnow/assets/**"
      - ".agents/skills/winnow/scripts/winnow.py"
      - ".github/workflows/remote-ci.yml"
  push:
    branches:
      - main
    paths:
      - "remote/**"
      - ".agents/skills/winnow/assets/**"
      - ".agents/skills/winnow/scripts/winnow.py"

permissions:
  contents: read

jobs:
  remote-unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install pinned remote package
        run: python -m pip install --disable-pip-version-check ./remote
      - name: Run remote unit and deterministic integration suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: remote/src
        run: python -B -m unittest discover -s remote/tests -v
      - name: Check deployment artifacts do not carry bearer field names
        run: |
          test -f remote/Dockerfile
          test -f remote/deploy/kubernetes.yaml
          ! grep -n 'claimToken\|browserCapability\|sessionHandle' remote/deploy/kubernetes.yaml
